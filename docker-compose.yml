version: '3.8'

services:
  # Web - Next.js приложение с встроенным nginx
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        RECAPTCHA_SECRET: ${RECAPTCHA_SECRET}
    container_name: my-app-web
    ports:
      - "3000:3000"
      - "443:443"
      - "80:80"
    volumes:
      # SSL сертификаты (самоподписанные для разработки)
      - ./web/nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - NODE_ENV=production
      - BOT_SENDER_URL=http://bot-sender:3001
      - RECAPTCHA_SECRET=${RECAPTCHA_SECRET}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - INTERNAL_HMAC_SECRET=${INTERNAL_HMAC_SECRET}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - bot-sender

  # Bot-sender - Сервис отправки в Telegram
  bot-sender:
    build:
      context: ./bot-sender
      dockerfile: Dockerfile
    container_name: my-app-bot-sender
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - INTERNAL_HMAC_SECRET=${INTERNAL_HMAC_SECRET}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/internal/send"]
      interval: 30s
      timeout: 10s
      retries: 3

# Сети
networks:
  # Приватная сеть: web ↔ bot-sender (без доступа извне)
  internal:
    driver: bridge
